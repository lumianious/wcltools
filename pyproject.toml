[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wcltools"
version = "0.4.0"
description = "Warcraft Logs raid timelines for humans and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
]

[project.scripts]
wcltools = "wcltools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyinstaller>=6.16,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["wcltools"]

[tool.hatch.build.targets.sdist]
include = ["/wcltools", "/scripts/build_release.py", "/scripts/refresh_catalog.py", "/tests", "/README.md", "/README.zh-CN.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
